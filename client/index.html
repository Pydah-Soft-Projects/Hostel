    <!-- Centralized Dynamic UI Theme Loader (Auto-detects Localhost 7001/7000 vs Production) -->
    <link rel="stylesheet" id="pydah-theme-css" href="https://ui-theme.pydah.edu.in/themes/theme.css" />
    <script>
      (function() {
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        
        // Allow explicit override via ?theme_server=... or localStorage
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const qServer = urlParams.get('theme_server');
          if (qServer) localStorage.setItem('PYDAH_THEME_SERVER', qServer);
        } catch (_) {}
        
        const savedServer = localStorage.getItem('PYDAH_THEME_SERVER');

        // Candidate servers in priority order:
        // When testing on localhost, prioritize http://localhost:7001 (Theme Editor) and http://localhost:7000 (Theme Server)
        const candidates = [];
        if (savedServer) candidates.push(savedServer);
        if (isLocal) {
          if (!candidates.includes('http://localhost:7001')) candidates.push('http://localhost:7001');
          if (!candidates.includes('http://localhost:7000')) candidates.push('http://localhost:7000');
        }
        candidates.push('https://ui-theme.pydah.edu.in');

        async function initTheme() {
          let chosen = 'https://ui-theme.pydah.edu.in';
          
          if (isLocal || savedServer) {
            for (const s of candidates) {
              if (s === 'https://ui-theme.pydah.edu.in') {
                chosen = s;
                break;
              }
              try {
                const ctrl = new AbortController();
                const tid = setTimeout(() => ctrl.abort(), 1200);
                // Check if server is responding
                let res = await fetch(`${s}/themes/version.json?t=${Date.now()}`, { signal: ctrl.signal, mode: 'cors' }).catch(() => null);
                if (!res || !res.ok) {
                  res = await fetch(`${s}/version.json?t=${Date.now()}`, { signal: ctrl.signal, mode: 'cors' }).catch(() => null);
                }
                if (!res || !res.ok) {
                  res = await fetch(`${s}/themes/theme.css?t=${Date.now()}`, { signal: ctrl.signal, mode: 'cors' }).catch(() => null);
                }
                clearTimeout(tid);
                if (res && res.ok) {
                  chosen = s;
                  console.log(`🎨 [Theme] Connected to local Theme Server at ${chosen}`);
                  break;
                }
              } catch (_) {}
            }
          }

          console.log(`🎨 [Theme] Active Theme Server: ${chosen}`);
          window.__ACTIVE_THEME_SERVER__ = chosen;

          // Update theme stylesheet
          const link = document.getElementById('pydah-theme-css');
          if (link) {
            link.href = `${chosen}/themes/theme.css?v=${Date.now()}`;
            link.onerror = () => { link.href = `${chosen}/theme.css?v=${Date.now()}`; };
          }

          // Inject theme loader script with target theme server
          const script = document.createElement('script');
          script.id = 'pydah-theme-loader';
          script.src = `${chosen}/themes/theme-loader.js`;
          script.setAttribute('data-theme-server', chosen);
          script.setAttribute('data-poll-interval', isLocal ? '5' : '30');
          script.onerror = () => {
            // Fallback to production loader SDK if local server doesn't host loader script
            const fb = document.createElement('script');
            fb.src = 'https://ui-theme.pydah.edu.in/themes/theme-loader.js';
            fb.setAttribute('data-theme-server', chosen);
            fb.setAttribute('data-poll-interval', isLocal ? '5' : '30');
            document.head.appendChild(fb);
          };
          document.head.appendChild(script);

          // Fast poll for Localhost Development
          // When testing with Theme Editor on localhost:7001, poll every 3s to apply updates as soon as "Publish Theme" is clicked
          if (isLocal && chosen.includes('localhost')) {
            let lastVer = null;
            let lastCss = '';

            setInterval(async () => {
              try {
                // 1. Try polling version.json
                let vRes = await fetch(`${chosen}/themes/version.json?t=${Date.now()}`).catch(() => null);
                if (!vRes || !vRes.ok) {
                  vRes = await fetch(`${chosen}/version.json?t=${Date.now()}`).catch(() => null);
                }

                if (vRes && vRes.ok) {
                  const data = await vRes.json();
                  const ver = data.version || data.hash || data.updatedAt || JSON.stringify(data);
                  if (lastVer && lastVer !== ver) {
                    console.log(`🎨 [Theme] Detected new theme published (${ver})! Applying...`);
                    if (link) link.href = `${chosen}/themes/theme.css?v=${Date.now()}`;
                    
                    // Directly apply CSS variables to :root
                    try {
                      const cRes = await fetch(`${chosen}/themes/theme.css?v=${Date.now()}`);
                      if (cRes.ok) {
                        const txt = await cRes.text();
                        const matches = txt.matchAll(/(--[\w-]+)\s*:\s*([^;]+);/g);
                        for (const m of matches) {
                          document.documentElement.style.setProperty(m[1].trim(), m[2].trim());
                        }
                      }
                    } catch (_) {}

                    window.dispatchEvent(new CustomEvent('theme:updated', { detail: data }));
                  }
                  lastVer = ver;
                  return;
                }

                // 2. Fallback: check theme.css directly
                const cssRes = await fetch(`${chosen}/themes/theme.css?t=${Date.now()}`).catch(() => null);
                if (cssRes && cssRes.ok) {
                  const txt = await cssRes.text();
                  if (lastCss && lastCss !== txt) {
                    console.log('🎨 [Theme] Detected theme.css change! Updating :root...');
                    if (link) link.href = `${chosen}/themes/theme.css?v=${Date.now()}`;
                    const matches = txt.matchAll(/(--[\w-]+)\s*:\s*([^;]+);/g);
                    for (const m of matches) {
                      document.documentElement.style.setProperty(m[1].trim(), m[2].trim());
                    }
                    window.dispatchEvent(new CustomEvent('theme:updated', { detail: { updated: true } }));
                  }
                  lastCss = txt;
                }
              } catch (_) {}
            }, 3000);
          }
        }

        initTheme();
      })();
    </script>
    
    <!-- Safari polyfills and compatibility fixes -->
    <script>
      // Safari localStorage polyfill and compatibility fixes
      (function() {
        const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
        
        if (isSafari) {
          console.log('🦁 Safari detected - applying compatibility fixes');
          
          // Ensure localStorage is available
          if (typeof localStorage === 'undefined') {
            console.warn('🦁 localStorage not available, using sessionStorage fallback');
            window.localStorage = window.sessionStorage;
          }
          
          // Fix for Safari's strict CORS handling
          if (window.fetch) {
            const originalFetch = window.fetch;
            window.fetch = function(url, options = {}) {
              // Add Safari-specific headers
              if (!options.headers) {
                options.headers = {};
              }
              options.headers['X-Requested-With'] = 'XMLHttpRequest';
              
              return originalFetch(url, options);
            };
          }
          
          // Fix for Safari's Promise handling
          if (!window.Promise) {
            console.warn('🦁 Promise not available - this might cause issues');
          }
        }
      })();
    </script>
    
    <!-- OneSignal SDK v16 - Improved Service Worker Registration -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      // Global variable to track service worker registration
      window.serviceWorkerRegistration = null;
      
      // Improved iOS/Safari detection
      const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const isIOSSafari = isSafari && isIOS;
      const isIOSChrome = /CriOS/.test(navigator.userAgent);
      
      console.log('🦁 Browser detection:', {
        userAgent: navigator.userAgent,
        isSafari,
        isIOS,
        isIOSSafari,
        isIOSChrome
      });
      
      // Improved service worker registration
      async function registerServiceWorker() {
              // Skip service worker registration for iOS Safari only (not iOS Chrome)
      if (isIOSSafari && !isIOSChrome) {
        console.log('🦁 iOS Safari detected - skipping OneSignal service worker registration');
          return null;
        }
        
        if ('serviceWorker'in navigator) {
          try {
            console.log('🔔 Registering OneSignal Service Worker from /OneSignalSDKWorker.js');
            
            // Register new service worker from the root
            const registration = await navigator.serviceWorker.register('/OneSignalSDKWorker.js', {
              scope: '/',
            });
            
            console.log('🔔 OneSignal Service Worker registered successfully:', registration);
            window.serviceWorkerRegistration = registration;
            
            // Wait for the service worker to be ready
            await navigator.serviceWorker.ready;
            console.log('🔔 OneSignal Service Worker is ready');
            
            return registration;
            
          } catch (error) {
            console.error('🔔 OneSignal Service Worker registration failed:', error);
            return null;
          }
        } else {
          console.warn('🔔 Service Worker not supported in this browser');
          return null;
        }
      }

      // Initialize OneSignal after service worker is ready
      async function initializeOneSignal() {
        // Skip OneSignal initialization for iOS Safari only (not iOS Chrome)
        if (isIOSSafari && !isIOSChrome) {
          console.log('🦁 iOS Safari detected - skipping OneSignal initialization');
          console.log('🦁 Push notifications will use database fallback only');
          return;
        }
        
        try {
          // Wait for service worker registration
          await registerServiceWorker();
          
          // Wait a bit more to ensure service worker is fully ready
          await new Promise(resolve => setTimeout(resolve, 500));

          // Push the initialization function to the OneSignal queue
          window.OneSignalDeferred.push(async function(OneSignal) {
            console.log('🔔 Initializing OneSignal SDK v16...');
            
            const config = {
              appId: "7a3290a8-d6a8-4e09-903f-c4a0f251ca01",
              safari_web_id: "web.onesignal.auto.42873e37-42b9-4e5d-9423-af83e9e44ff4",
              notifyButton: {
                enable: true,
              },
              allowLocalhostAsSecureOrigin: true, // For development
              serviceWorkerPath: "OneSignalSDKWorker.js", // Ensure this points to the root
            };
            
            // Initialize OneSignal
            await OneSignal.init(config);
            console.log('🔔 OneSignal SDK v16 initialized successfully');
            
            // Make OneSignal available globally for our notification manager
            window.OneSignal = OneSignal;
          });
          
        } catch (error) {
          console.error('🔔 Error in initializeOneSignal:', error);
        }
      }

      // Start initialization when page loads
      window.addEventListener('load', initializeOneSignal);
    </script>

    <!-- PWA Service Worker Registration -->
    <script>
      // Register service worker for PWA functionality
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
      
      // Handle beforeinstallprompt for PWA installation
      let deferredPrompt;
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent Chrome 67 and earlier from automatically showing the prompt
        e.preventDefault();
        // Stash the event so it can be triggered later
        deferredPrompt = e;
        // Show install prompt to user
        showInstallPrompt();
      });
      
      function showInstallPrompt() {
        // You can show a custom install button here
        console.log('PWA install prompt available');
        // Example: show a custom install button
        // document.getElementById('install-button').style.display = 'block';
      }
      
      function installPWA() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              console.log('User accepted the install prompt');
            } else {
              console.log('User dismissed the install prompt');
            }
            deferredPrompt = null;
          });
        }
      }
      
      // Make installPWA available globally
      window.installPWA = installPWA;
    </script>
